<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALIFE 見た目ジェネレーター</title>
<style>
  :root{ --bg1:#0c1445; --bg2:#1a2980; --panel:#111827; --border:#2a3352; --text:#e8eefc; --muted:#9fb3d1; --accent:#4fa3ff; }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
    background:radial-gradient(1000px 600px at 20% -10%, #26326855, transparent 60%), linear-gradient(135deg,var(--bg1),var(--bg2)); }
  header{ position:sticky; top:0; z-index:10; backdrop-filter:blur(8px); background:rgba(10,16,38,.82);
    border-bottom:1px solid var(--border); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0)); }
  h1{ font-size:1rem; margin:0 0 8px }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .btn{ appearance:none; border:1px solid var(--border); background:#0b122a; color:var(--text);
    padding:10px 12px; border-radius:10px; font-weight:700; cursor:pointer; min-height:44px }
  select.btn{ max-width:210px; padding-right:28px }
  .btn.primary{ border-color:var(--accent); background:#12305c }
  .btn:active{ transform:translateY(1px) }
  .chip{ border:1px solid var(--border); background:#0b122a; color:var(--muted); padding:8px 10px;
    border-radius:999px; cursor:pointer; min-height:40px; font-weight:600 }
  .chip.on{ color:#fff; border-color:var(--accent); background:#12305c }
  .slider{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.8rem }
  .slider input{ width:120px }
  main{ padding:12px }
  #grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px }
  body.roster-mode #grid{ display:none }
  .cell{ position:relative; border:1px solid var(--border); border-radius:12px; background:#070e22;
    aspect-ratio:1/1; overflow:hidden; cursor:pointer }
  .cell canvas{ width:100%; height:100%; display:block }
  .cell.locked{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset }
  .cell .lock{ position:absolute; top:4px; right:4px; width:28px; height:28px; border-radius:8px;
    border:1px solid var(--border); background:rgba(6,12,30,.7); color:var(--muted); font-size:.9rem;
    display:flex; align-items:center; justify-content:center }
  .cell.locked .lock{ color:var(--accent); border-color:var(--accent) }
  .cell .tag{ position:absolute; left:4px; bottom:4px; font-size:.62rem; color:var(--muted);
    background:rgba(6,12,30,.6); padding:1px 5px; border-radius:6px }
  .hint{ color:var(--muted); font-size:.78rem; margin:4px 2px }
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(4,8,20,.7); display:none;
    align-items:flex-start; justify-content:center; padding:12px; overflow:auto }
  .overlay.on{ display:flex }
  .modal{ width:min(560px,100%); background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:14px; margin:auto }
  .modal h2{ font-size:.95rem; margin:0 0 8px }
  .preview{ width:100%; aspect-ratio:16/10; background:#070e22; border:1px solid var(--border);
    border-radius:12px; display:block }
  .ctl{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.8rem; color:var(--muted) }
  .ctl label{ flex:0 0 78px }
  .ctl input[type=range]{ flex:1 }
  .ctl .v{ flex:0 0 40px; text-align:right; color:#9bd0ff; font-variant-numeric:tabular-nums }
  .toggles{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
  .sec{ margin-top:10px; border-top:1px solid var(--border); padding-top:8px }
  .info{ font-size:.78rem; color:var(--muted); line-height:1.5 }
  .info b{ color:#bcd4ff; font-weight:600 }
  textarea{ width:100%; height:180px; background:#070e22; color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:8px; font-family:ui-monospace,monospace; font-size:.72rem }
  #roster{ display:none }
  body.roster-mode #roster{ display:block }
  .roster-sheet{ min-height:calc(100vh - 104px); border:1px solid #b9cbd6; border-radius:14px; background:
    radial-gradient(900px 500px at 50% 12%, rgba(150,212,220,.30), transparent 68%),
    linear-gradient(180deg,#eef8fb 0%,#dceef4 100%); color:#234154; padding:18px 22px 16px;
    box-shadow:0 20px 70px rgba(3,10,28,.32); overflow:hidden }
  .roster-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px;
    color:#174456; text-transform:uppercase; letter-spacing:.08em; font-weight:800 }
  .roster-title{ font-size:clamp(1rem,2.2vw,1.35rem) }
  .roster-sub{ font-size:.72rem; color:#547083; white-space:nowrap }
  .roster-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:14px 12px }
  .roster-card{ position:relative; min-height:118px; border-radius:8px; cursor:pointer; outline:0;
    border:1px solid rgba(82,119,137,.20); background:rgba(255,255,255,.22) }
  .roster-card canvas{ width:100%; height:88px; display:block }
  .roster-card.locked{ border-color:#2e9bd8; box-shadow:0 0 0 1px rgba(46,155,216,.45) inset }
  .roster-num{ position:absolute; top:6px; left:7px; min-width:22px; height:22px; border:1px solid #8aa6b5;
    border-radius:999px; display:flex; align-items:center; justify-content:center; color:#486273;
    background:rgba(245,252,255,.76); font-size:.72rem; font-weight:800 }
  .roster-pin{ position:absolute; top:6px; right:7px; color:#476477; font-size:.82rem }
  .roster-label{ display:flex; align-items:center; justify-content:center; gap:5px; min-height:24px;
    padding:0 5px 6px; color:#4e6878; font-size:.66rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .roster-dot{ flex:0 0 9px; width:9px; height:9px; border-radius:50%; background:var(--group,#5bb8aa); box-shadow:0 0 0 2px rgba(255,255,255,.58) }
  .roster-legend{ display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:18px; padding-top:12px;
    border-top:1px solid rgba(82,119,137,.30); color:#547083; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em }
  .legend-item{ display:flex; align-items:center; gap:7px }
  @media (max-width:680px){
    .roster-sheet{ min-height:calc(100vh - 138px); padding:14px 12px }
    .roster-head{ align-items:flex-start; flex-direction:column; margin-bottom:12px }
    .roster-sub{ white-space:normal }
    .roster-grid{ grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:10px 8px }
    .roster-card{ min-height:104px }
    .roster-card canvas{ height:76px }
  }
</style>
</head>
<body>
<header>
  <h1>🧬 ALIFE 見た目ジェネレーター <span class="hint" style="font-weight:400">— 本物のレンダラ版</span></h1>
  <div class="bar">
    <button class="btn primary" id="gen">🎲 生成</button>
    <span class="chip" data-count="24">24</span>
    <span class="chip on" data-count="48">48</span>
    <span class="chip" data-count="96">96</span>
    <span class="slider">ドリフト<input type="range" id="drift" min="0" max="0.4" step="0.01" value="0.12"><span id="driftv">0.12</span></span>
    <button class="btn" id="viewToggle">▦ Sheet view</button>
    <button class="btn" id="export">⬇ 書き出し</button>
    <button class="btn" id="exportPins">📌 ピンのみ</button>
  </div>
  <div class="hint">タップで拡大・遺伝子を調整／右上📌で固定して残りだけ再生成。同じ遺伝子＝同じ姿・同じ色。</div>
</header>
<main>
  <div id="grid"></div>
  <section id="roster">
    <div class="roster-sheet">
      <div class="roster-head">
        <div class="roster-title">Microverse // Lifeform Roster</div>
        <div class="roster-sub">Diversity through evolution</div>
      </div>
      <div class="roster-grid" id="rosterGrid"></div>
      <div class="roster-legend" id="rosterLegend"></div>
    </div>
  </section>
</main>

<div class="overlay" id="detail">
  <div class="modal">
    <h2 id="dTitle">種の調整</h2>
    <canvas class="preview" id="dCanvas"></canvas>
    <div class="sec" id="geneCtls"></div>
    <div class="sec">
      <div class="hint">希少形質</div>
      <div class="toggles" id="rareToggles"></div>
    </div>
    <div class="sec info" id="derived"></div>
    <div class="sec bar">
      <button class="btn" id="dReroll">🎲 この種を再生成</button>
      <button class="btn" id="dDrift">🌱 複製してドリフト</button>
      <button class="btn primary" id="dClose">閉じる</button>
    </div>
  </div>
</div>

<div class="overlay" id="exp">
  <div class="modal">
    <h2>書き出し（JSON）</h2>
    <div class="hint">この JSON をゲームの初期集団などに読み込む想定。コピーして共有できます。</div>
    <textarea id="expText" readonly></textarea>
    <div class="sec bar">
      <button class="btn primary" id="copyBtn">📋 コピー</button>
      <button class="btn" id="expClose">閉じる</button>
    </div>
  </div>
</div>

<script src="organism_model.js"></script>
<script src="organism_render.js"></script>
<script src="organism_roster_art.js"></script>
<script>
(function(){
  'use strict';
  var M = window.OrganismModel, R = window.OrganismRender, A = window.OrganismRosterArt;
  var GENE_KEYS = ['speed','size','metabolism','fecundity','sense','diet','formSeed'];
  var GENE_LABEL = { speed:'速さ', size:'大きさ', metabolism:'代謝', fecundity:'繁殖', sense:'感知', diet:'食性', formSeed:'形' };
  var RARE = [['glow','発光'],['chl','葉緑体']];
  var TAU = Math.PI*2;

  // stub environment for the shared renderer (no live game state in the tool)
  var drawEnv = {
    ADAPTATION_BY_ID: M.ADAPTATION_BY_ID, CONFIG: { rendering:{ microView:{ baseScale:0.34 } } },
    ROLE_HUE: M.ROLE_HUE, adaptationProfilesFromGenes: M.adaptationProfilesFromGenes,
    clamp: M.clamp, clamp01: M.clamp01, dayNight:{ isNight:false, night:0 },
    formFromGenes: M.formFromGenes, isPredatorBursting:function(){ return false; },
    lerp: M.lerp, organismVisualScale:function(){ return 1; },
    renderPerf:{ tiny:false, low:false }, selectedOrganism:null,
    ui:{ roleViz:false, microView:false, showSense:false }
  };
  var buildEnv = {
    SYMBOL_SHAPES: M.SYMBOL_SHAPES, clamp: M.clamp, formFromGenes: M.formFromGenes,
    rngFromKey: M.rngFromKey, speciesKey: M.speciesKey, speciesPalette: M.speciesPalette,
    topologyFromGenes: M.topologyFromGenes
  };

  var grid = document.getElementById('grid');
  var rosterGrid = document.getElementById('rosterGrid');
  var rosterLegend = document.getElementById('rosterLegend');
  var viewToggle = document.getElementById('viewToggle');
  var typeSelect = document.createElement('select');
  typeSelect.className = 'btn';
  typeSelect.id = 'typeSelect';
  typeSelect.title = 'Generate by visual form';
  if(viewToggle) viewToggle.insertAdjacentElement('afterend', typeSelect);
  var appendageSelect = document.createElement('select');
  appendageSelect.className = 'btn';
  appendageSelect.id = 'appendageSelect';
  appendageSelect.title = '素体（単体細胞）系の付属物を固定します';
  [['auto','付属: 自動'],['cilia','付属: 繊毛'],['spikes','付属: トゲ'],['spokes','付属: 放射トゲ'],['beads','付属: 放射ビーズ'],['antennae','付属: 触角'],['flagella','付属: 鞭毛']].forEach(function(p){
    var op = document.createElement('option'); op.value = p[0]; op.textContent = p[1]; appendageSelect.appendChild(op);
  });
  typeSelect.insertAdjacentElement('afterend', appendageSelect);
  var count = 48, species = [], activeIdx = -1, viewMode = 'grid', selectedType = 'all', selectedAppendage = 'auto';
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var GROUPS = [
    { id:'grazer', label:'Herbivore / Filter', color:'#33b999', order:0 },
    { id:'scav', label:'Omnivore / Scavenger', color:'#c79a17', order:1 },
    { id:'predator', label:'Predator', color:'#d9436a', order:2 },
    { id:'special', label:'Special / Symbiotic / Mega', color:'#8e63d7', order:3 }
  ];

  function randSeed(){ return (Math.random()*4294967296)>>>0; }
  function genesFromSeed(seed){
    var s=seed>>>0, g={};
    function rr(){ s=(s+0x6D2B79F5)|0; var t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return((t^(t>>>14))>>>0)/4294967296; }
    for(var i=0;i<GENE_KEYS.length;i++) g[GENE_KEYS[i]]=rr();
    return g;
  }
  function makeSpecies(seed){ seed=(seed>>>0)||1; return { seed:seed, genes:genesFromSeed(seed), flags:{}, locked:false }; }
  function driftSpecies(parent, amt){
    var g={}; for(var i=0;i<GENE_KEYS.length;i++){ var k=GENE_KEYS[i]; g[k]=M.clamp(parent.genes[k]+(Math.random()-0.5)*2*amt,0,1); }
    return { seed:(parent.seed^Math.floor(Math.random()*1e9))>>>0, genes:g, flags:Object.assign({},parent.flags), locked:false };
  }

  function dietClass(d){ return d<0.33?'草':(d<0.66?'雑':'肉'); }
  function groupFor(sp, o){
    var flags = sp.flags || {};
    var special = o.isMega; // only genuine mega -> purple group; diet drives the rest
    var role = o.role === 'pack' ? 'pursuit' : o.role;
    if(special) return GROUPS[3];
    if((sp.genes.diet||0)>=0.66 || role==='ambusher' || role==='pursuit') return GROUPS[2];
    if((sp.genes.diet||0)>0.33 || role==='scav') return GROUPS[1];
    return GROUPS[0];
  }

  // build a full organism from a species, ready to draw
  function buildCreature(sp){
    var o = M.buildOrganismBase(sp.genes, (sp.seed>>>0)||1);
    o.flags = Object.assign({}, sp.flags);
    delete o.flags.crown;
    delete o.flags.colony;
    var b = R.buildSymbol(o, buildEnv);
    o._symbol = b.symbol; o.personalSpaceR = b.personalSpaceR;
    o.symbolShapePath = R.symbolShapePath;
    o.drawTinySymbolic = function(){};
    o.prepareSymbolDetails = function(){};
    try { o.adaptations = M.adaptationProfilesFromGenes(sp.genes, o.flags, o.morphologyTopology, o.role) || []; } catch(e){ o.adaptations = []; }
    o.appendageKind = selectedAppendage; // plain single-body forms honour this override
    return o;
  }

  function visualKindFor(sp){
    var o = buildCreature(sp);
    return A && A.visualKind ? A.visualKind(o) : o.morphologyTopology;
  }

  function prepareTypeSelect(){
    var types = (A && A.visualTypes) ? A.visualTypes : [{ id:'all', label:'All forms' }];
    typeSelect.innerHTML = '';
    types.forEach(function(t){
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.label;
      typeSelect.appendChild(opt);
    });
    typeSelect.value = selectedType;
  }

  function typeRng(sp, type){
    return M.rngFromKey('generator-type:'+type+':'+((sp.seed>>>0)||1));
  }

  // visualKind() buckets formSeed over the plain-body shape list, so aim at each
  // bucket's centre. Derived from the list itself: adding a form can't desync this.
  var SINGLE_SEED = (function(){
    var shapes = (A && A.singleShapes) || [], map = {};
    for(var i=0;i<shapes.length;i++) map[shapes[i]] = (i + 0.5) / shapes.length;
    return map;
  })();

  function biasSpeciesForType(sp, type){
    var rr = typeRng(sp, type);
    if(type==='jelly'){
      sp.flags.glow = true;
      sp.genes.sense = 0.84 + rr()*0.14;
      sp.genes.size = 0.66 + rr()*0.22; // keep below the isMega(>0.97) threshold
    } else if(type==='single-leaf'){
      sp.flags.chl = true;
      sp.genes.speed = Math.max(sp.genes.speed, 0.66 + rr()*0.25);
      sp.genes.diet = Math.min(sp.genes.diet, 0.42);
    } else if(type==='single-spindle'){
      sp.genes.speed = 0.42 + rr()*0.18;
      sp.genes.size = Math.max(sp.genes.size, 0.48 + rr()*0.20);
      sp.genes.metabolism = Math.min(sp.genes.metabolism, 0.54);
      sp.genes.fecundity = Math.min(sp.genes.fecundity, 0.56);
      sp.genes.sense = Math.min(sp.genes.sense, 0.48);
      sp.genes.diet = 0.36 + rr()*0.24;
      sp.genes.formSeed = Math.max(sp.genes.formSeed, 0.66 + rr()*0.22);
    } else if(type==='radial-arms' || type==='radial-star'){
      sp.genes.sense = Math.max(sp.genes.sense, 0.66);
      sp.genes.diet = 0.48 + rr()*0.22;
      sp.genes.metabolism = Math.min(sp.genes.metabolism, 0.60);
      sp.genes.formSeed = type==='radial-star' ? 0.75 : 0.25; // formSeed splits the two radial bodies
    } else if(type==='mesh-lace'){
      sp.genes.metabolism = Math.max(sp.genes.metabolism, 0.76);
      sp.genes.sense = Math.max(sp.genes.sense, 0.58);
      sp.genes.size = Math.max(sp.genes.size, 0.50);
    } else if(type.indexOf('cluster-')===0){
      sp.genes.fecundity = Math.max(sp.genes.fecundity, 0.72);
      sp.genes.size = Math.min(sp.genes.size, 0.68);
    } else if(type.indexOf('chain-')===0){
      sp.genes.speed = Math.max(sp.genes.speed, 0.54);
      sp.genes.sense = Math.max(sp.genes.sense, 0.42);
    } else if(SINGLE_SEED[type] != null){
      // push toward "single" topology, then formSeed bucket picks the silhouette
      sp.genes.sense = Math.min(sp.genes.sense, 0.36);
      sp.genes.metabolism = Math.min(sp.genes.metabolism, 0.40);
      sp.genes.fecundity = Math.min(sp.genes.fecundity, 0.40);
      sp.genes.speed = Math.min(sp.genes.speed, 0.50);
      sp.flags.chl = false;
      sp.genes.size = 0.45 + rr()*0.20;
      // the hunters read as carnivores (red); the rest keep their diet-driven colour
      if({'single-trap':1,'single-dart':1,'single-barb':1}[type]) sp.genes.diet = 0.80 + rr()*0.14;
      else sp.genes.diet = Math.min(sp.genes.diet, 0.60);
      sp.genes.formSeed = SINGLE_SEED[type];
    }
    return sp;
  }

  function makeSpeciesForType(type){
    if(type==='all') return makeSpecies(randSeed());
    for(var tries=0; tries<1800; tries++){
      var sp = biasSpeciesForType(makeSpecies(randSeed()), type);
      if(visualKindFor(sp)===type) return sp;
    }
    return biasSpeciesForType(makeSpecies(randSeed()), type);
  }

  function sizeCanvas(cv, w, h){ cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR); var ctx=cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0); return ctx; }
  function paintBackdrop(ctx, w, h){
    var g=ctx.createRadialGradient(w*0.5,h*0.42,2,w*0.5,h*0.5,Math.max(w,h)*0.72);
    g.addColorStop(0,'#12365a'); g.addColorStop(1,'#071022'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  }
  function paintRosterBackdrop(ctx, w, h, group){
    var g=ctx.createRadialGradient(w*0.52,h*0.44,2,w*0.5,h*0.5,Math.max(w,h)*0.72);
    g.addColorStop(0,'rgba(255,255,255,.96)');
    g.addColorStop(0.62,'rgba(236,249,252,.74)');
    g.addColorStop(1,'rgba(210,232,240,.78)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.globalAlpha=.14;
    ctx.fillStyle=group.color;
    ctx.beginPath();
    ctx.ellipse(w*0.50,h*0.70,w*0.26,h*0.08,0,0,TAU);
    ctx.fill();
    ctx.restore();
  }
  function drawCreature(ctx, o, w, h, fill, group){
    if(A && A.drawOrganism){
      var artFill = viewMode==='roster' ? Math.max(fill||0.42, 0.38) : (fill||0.42);
      A.drawOrganism(ctx, o, w, h, { fill:artFill, groupColor:group&&group.color, roster:viewMode==='roster' });
      return;
    }
    var vr = Math.max(o._symbol.visualR || o.size, o.size*1.2);
    var k = (Math.min(w,h)*(fill||0.42)) / vr;
    ctx.save(); ctx.translate(w/2, h/2); ctx.scale(k,k); o.x=0; o.y=0;
    R.drawOrganism(o, ctx, null, drawEnv);
    ctx.restore();
  }
  function drawRosterInto(cv, sp){
    var rect=cv.getBoundingClientRect(); var w=Math.round(rect.width), h=Math.round(rect.height);
    if(w<2||h<2) return false;
    var o=buildCreature(sp), group=groupFor(sp,o);
    var ctx=sizeCanvas(cv,w,h); ctx.clearRect(0,0,w,h); paintRosterBackdrop(ctx,w,h,group);
    ctx.save();
    ctx.globalAlpha=.26;
    ctx.fillStyle='rgba(35,65,84,.28)';
    ctx.beginPath();
    ctx.ellipse(w*0.5,h*0.78,w*0.24,h*0.055,0,0,TAU);
    ctx.fill();
    ctx.restore();
    drawCreature(ctx,o,w,h,0.30,group);
    cv.__o=o;
    return true;
  }
  function drawInto(cv, sp){
    var rect=cv.getBoundingClientRect(); var w=Math.round(rect.width), h=Math.round(rect.height);
    if(w<2||h<2) return false;
    var ctx=sizeCanvas(cv,w,h); ctx.clearRect(0,0,w,h); paintBackdrop(ctx,w,h);
    var o=buildCreature(sp), group=groupFor(sp,o); drawCreature(ctx,o,w,h,0.42,group); cv.__o=o;
    return true;
  }
  function visualLabelFor(sp){
    var o=buildCreature(sp);
    return (A&&A.visualKind?A.visualKind(o):o.morphologyTopology)+' / '+dietClass(sp.genes.diet);
  }
  function tagText(sp){ return visualLabelFor(sp); }
  function drawAll(){
    var ok=true;
    if(viewMode==='grid'){
      for(var i=0;i<grid.children.length;i++){ var cv=grid.children[i].querySelector('canvas'); if(cv&&species[i]){ if(!drawInto(cv,species[i])) ok=false; } }
    } else {
      for(var j=0;j<rosterGrid.children.length;j++){
        var rcv=rosterGrid.children[j].querySelector('canvas');
        var idx=+(rosterGrid.children[j].getAttribute('data-index')||0);
        if(rcv&&species[idx]){ if(!drawRosterInto(rcv,species[idx])) ok=false; }
      }
    }
    if(!ok) requestAnimationFrame(drawAll);
  }
  function buildRoster(){
    rosterGrid.innerHTML='';
    rosterLegend.innerHTML='';
    GROUPS.forEach(function(g){
      var item=document.createElement('div'); item.className='legend-item';
      item.innerHTML='<span class="roster-dot" style="--group:'+g.color+'"></span><span>'+g.label+'</span>';
      rosterLegend.appendChild(item);
    });
    var order=species.map(function(sp,i){ var o=buildCreature(sp), group=groupFor(sp,o); return {i:i,o:o,group:group}; });
    order.sort(function(a,b){ return a.group.order-b.group.order || a.o.morphologyTopology.localeCompare(b.o.morphologyTopology) || a.i-b.i; });
    order.forEach(function(row,pos){
      var sp=species[row.i], card=document.createElement('div'), group=row.group;
      card.className='roster-card'+(sp.locked?' locked':'');
      card.setAttribute('data-index', row.i);
      card.style.setProperty('--group', group.color);
      var num=document.createElement('div'); num.className='roster-num'; num.textContent=String(pos+1);
      var pin=document.createElement('div'); pin.className='roster-pin'; pin.textContent=sp.locked?'📌':'';
      var cv=document.createElement('canvas');
      var label=document.createElement('div'); label.className='roster-label';
      label.innerHTML='<span class="roster-dot"></span><span>'+visualLabelFor(sp)+'</span>';
      card.appendChild(num); card.appendChild(pin); card.appendChild(cv); card.appendChild(label);
      card.addEventListener('click',function(){ openDetail(row.i); });
      rosterGrid.appendChild(card);
    });
  }

  function buildGrid(){
    grid.innerHTML='';
    for(var i=0;i<species.length;i++){ (function(i){
      var sp=species[i];
      var cell=document.createElement('div'); cell.className='cell'+(sp.locked?' locked':'');
      var cv=document.createElement('canvas'); cell.appendChild(cv);
      var lock=document.createElement('div'); lock.className='lock'; lock.textContent=sp.locked?'📌':'○';
      var tag=document.createElement('div'); tag.className='tag'; tag.textContent=tagText(sp);
      cell.appendChild(lock); cell.appendChild(tag);
      lock.addEventListener('click',function(e){ e.stopPropagation(); sp.locked=!sp.locked; cell.classList.toggle('locked',sp.locked); lock.textContent=sp.locked?'📌':'○'; });
      cell.addEventListener('click',function(){ openDetail(i); });
      grid.appendChild(cell);
    })(i); }
    buildRoster();
    requestAnimationFrame(function(){ requestAnimationFrame(drawAll); });
  }
  // even-coverage: when generating "all", spread cells across every form
  // instead of following the (skewed) gene->topology distribution.
  function coverageForms(n){
    var forms = (A && A.visualTypes ? A.visualTypes : []).map(function(t){return t.id;}).filter(function(id){return id && id!=='all';});
    if(!forms.length) return null;
    var seq=[], pool=[];
    function reshuffle(){ pool=forms.slice(); for(var k=pool.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; } }
    reshuffle();
    for(var i=0;i<n;i++){ if(!pool.length) reshuffle(); seq.push(pool.pop()); }
    return seq;
  }
  function generate(){
    var next=[];
    var cover = (selectedType==='all') ? coverageForms(count) : null;
    for(var i=0;i<count;i++){
      if(species[i]&&species[i].locked){ next.push(species[i]); }
      else if(cover){ next.push(makeSpeciesForType(cover[i])); }
      else { next.push(makeSpeciesForType(selectedType)); }
    }
    species=next; buildGrid();
  }

  // ---- detail modal ----
  var detail=document.getElementById('detail'); var dCanvas=document.getElementById('dCanvas');
  function renderDetail(){
    var sp=species[activeIdx]; if(!sp) return;
    var o=buildCreature(sp);
    document.getElementById('dTitle').textContent='Type '+(A&&A.visualKind?A.visualKind(o):o.morphologyTopology)+' / '+dietClass(sp.genes.diet)+' (seed '+sp.seed+')';
    var adapts=M.adaptationProfilesFromGenes(sp.genes, o.flags, o.morphologyTopology, o.role);
    document.getElementById('derived').innerHTML =
      '<b>種ID</b> '+o.speciesKey+' ／ <b>形態</b> '+o.morphologyTopology+' ／ <b>ロール</b> '+o.role+'<br>'+
      '<b>大きさ</b> '+o.size.toFixed(1)+' ／ <b>節</b> '+o._symbol.nodes.length+' ／ <b>適応</b> '+(adapts.length?adapts.join(', '):'なし');
    var rect=dCanvas.getBoundingClientRect(); var w=Math.round(rect.width), h=Math.round(rect.height);
    if(w<2||h<2){ requestAnimationFrame(renderDetail); return; }
    var ctx=sizeCanvas(dCanvas,w,h); ctx.clearRect(0,0,w,h); paintBackdrop(ctx,w,h);
    drawCreature(ctx,o,w,h,0.40,groupFor(sp,o));
  }
  function refreshCell(){
    var cell=grid.children[activeIdx];
    if(cell){ drawInto(cell.querySelector('canvas'),species[activeIdx]); cell.querySelector('.tag').textContent=tagText(species[activeIdx]); }
    buildRoster(); requestAnimationFrame(drawAll);
  }
  function slider(label,val,on){
    var row=document.createElement('div'); row.className='ctl';
    var l=document.createElement('label'); l.textContent=label;
    var inp=document.createElement('input'); inp.type='range'; inp.min=0; inp.max=1; inp.step=0.01; inp.value=val;
    var v=document.createElement('span'); v.className='v'; v.textContent=(+val).toFixed(2);
    inp.addEventListener('input',function(){ v.textContent=(+inp.value).toFixed(2); on(+inp.value); renderDetail(); refreshCell(); });
    row.appendChild(l); row.appendChild(inp); row.appendChild(v); return row;
  }
  function toggle(key,label,flags){
    var b=document.createElement('span'); b.className='chip'+(flags[key]?' on':''); b.textContent=label;
    b.addEventListener('click',function(){ flags[key]=!flags[key]; b.classList.toggle('on'); renderDetail(); refreshCell(); });
    return b;
  }
  function openDetail(i){
    activeIdx=i; var sp=species[i];
    var gc=document.getElementById('geneCtls'); gc.innerHTML='';
    GENE_KEYS.forEach(function(k){ gc.appendChild(slider(GENE_LABEL[k]||k, sp.genes[k], function(val){ sp.genes[k]=val; })); });
    var rt=document.getElementById('rareToggles'); rt.innerHTML='';
    RARE.forEach(function(p){ rt.appendChild(toggle(p[0],p[1],sp.flags)); });
    detail.classList.add('on'); renderDetail();
  }
  document.getElementById('dClose').addEventListener('click',function(){ detail.classList.remove('on'); });
  detail.addEventListener('click',function(e){ if(e.target===detail) detail.classList.remove('on'); });
  document.getElementById('dReroll').addEventListener('click',function(){
    var was=species[activeIdx].locked; species[activeIdx]=makeSpeciesForType(selectedType); species[activeIdx].locked=was; openDetail(activeIdx); refreshCell();
  });
  document.getElementById('dDrift').addEventListener('click',function(){
    var child=driftSpecies(species[activeIdx], +document.getElementById('drift').value);
    var placed=false;
    for(var i=0;i<species.length;i++){ if(!species[i].locked && i!==activeIdx){ species[i]=child; placed=true; buildGrid(); break; } }
    if(!placed){ species.push(child); count=species.length; buildGrid(); }
    detail.classList.remove('on');
  });

  // ---- export ----
  function payload(list){ return JSON.stringify(list.map(function(s){ return { seed:s.seed, genes:s.genes, flags:s.flags }; }), null, 2); }
  var exp=document.getElementById('exp');
  function showExport(list){ if(!list.length){ alert('対象がありません（ピンが0件）。'); return; } document.getElementById('expText').value=payload(list); exp.classList.add('on'); }
  document.getElementById('export').addEventListener('click',function(){ showExport(species); });
  document.getElementById('exportPins').addEventListener('click',function(){ showExport(species.filter(function(s){return s.locked;})); });
  document.getElementById('expClose').addEventListener('click',function(){ exp.classList.remove('on'); });
  exp.addEventListener('click',function(e){ if(e.target===exp) exp.classList.remove('on'); });
  document.getElementById('copyBtn').addEventListener('click',function(){
    var ta=document.getElementById('expText'); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});
    try{ document.execCommand('copy'); }catch(e){}
    var self=this; self.textContent='✓ コピー済'; setTimeout(function(){ self.textContent='📋 コピー'; },1200);
  });

  // ---- controls ----
  document.getElementById('gen').addEventListener('click',generate);
  prepareTypeSelect();
  typeSelect.addEventListener('change',function(){ selectedType=this.value||'all'; generate(); });
  appendageSelect.addEventListener('change',function(){ selectedAppendage=this.value||'auto'; drawAll(); if(detail.classList.contains('on')) renderDetail(); });
  viewToggle.addEventListener('click',function(){
    viewMode = viewMode==='grid' ? 'roster' : 'grid';
    document.body.classList.toggle('roster-mode', viewMode==='roster');
    this.textContent = viewMode==='roster' ? '▦ Card view' : '▦ Sheet view';
    requestAnimationFrame(function(){ requestAnimationFrame(drawAll); });
  });
  document.getElementById('drift').addEventListener('input',function(){ document.getElementById('driftv').textContent=(+this.value).toFixed(2); });
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-count]'),function(ch){
    ch.addEventListener('click',function(){ document.querySelectorAll('.chip[data-count]').forEach(function(c){ c.classList.remove('on'); }); ch.classList.add('on'); count=+ch.getAttribute('data-count'); generate(); });
  });
  window.addEventListener('resize',drawAll);
  window.addEventListener('load',drawAll);

  if(!M || !R){ document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;color:#ff6b6b">モジュール読込エラー</div>'); return; }
  generate();
})();
</script>
</body>
</html>
