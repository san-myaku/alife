<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="icon" href="data:," />
<title>記号生命進化シミュレーター — Symbolic Shapes v1</title>
<style>
  :root{ --bg1:#0c1445; --bg2:#1a2980; --panel:#111827cc; --panel-border:#2a3352; --text:#e8eefc; --muted:#9fb3d1; --warn:#ff6b6b; --ok:#50fa7b; --amber:#f7b731; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--text);
    background: radial-gradient(1000px 600px at 20% -10%, #26326866, transparent 60%), linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%); overflow:hidden; transition: background 0.6s ease; }
  .wrap{ display:grid; grid-template-columns: 1fr 360px; gap:16px; height:100%; padding:16px; }
  #viewport{ width:100%; height:100%; display:block; border-radius:12px; background:#020617; box-shadow: inset 0 0 0 1px #0b132b; touch-action:none; }
  .panel{ height:100%; overflow:auto; background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:14px; backdrop-filter: blur(6px); }
  h1{font-size:1.05rem; letter-spacing:.02em; margin:2px 0 10px; font-weight:700}
  .row{display:flex; gap:10px; margin:10px 0; flex-wrap:wrap}
  .btn{ appearance:none; border:1px solid #2d3a68; background:#0b122a; color:var(--text); padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600; transition:.15s; }
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn:hover{transform:translateY(-1px)}

  .btn.on{ border-color:#4fa3ff; box-shadow: 0 0 0 1px rgba(79,163,255,0.25), inset 0 0 0 1px rgba(79,163,255,0.15); }
  .dot.amb{background:#b06cff}
  .dot.pack{background:#ff4b4b}
  .dot.scav{background:#ffd166}
  .dot.filt{background:#46f4a5}
  .dot.oth{background:#6ecbff}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .control{margin:8px 0 14px}
  label{font-size:.86rem; color:var(--muted); display:flex; align-items:center; justify-content:space-between}
  .value{font-weight:700; color:#9bd0ff}
  input[type="range"]{width:100%}
  .stats{display:grid; grid-template-columns:1fr; gap:8px; margin:4px 0 10px}
  .stat{background:#0b122a; border:1px solid #1b2548; border-radius:10px; padding:10px}
  .stat .k{font-size:.78rem; color:var(--muted)}
  .stat .v{font-weight:800; font-feature-settings:"tnum"; letter-spacing:.02em}
  .log{height:28vh; overflow:auto; background:#071022; border:1px solid #142046; padding:10px; border-radius:10px; font-size:.9rem; line-height:1.4}
  .mini{height:120px; border:1px solid #142046; border-radius:10px; background:#070e22; display:block; width:100%;}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; font-size:.72rem; border:1px solid #274; color:#bdf; background:#0a1a2a}
  .hint{color:#9db6e8; font-size:.8rem; margin-top:6px}
  .toolmenu{ position:absolute; display:none; right:14px; top:80px; background:#0a1229; border:1px solid #1b2550; border-radius:12px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:20; }
  .toolmenu button{ display:flex; align-items:center; gap:8px; width:200px; margin:4px 0; background:#0b122a; border:1px solid #1b2548; color:#dbe7ff; padding:8px 10px; border-radius:10px; cursor:pointer }
  .legend{display:flex; gap:8px; margin:6px 0 0}
  .dot{width:10px; height:10px; border-radius:2px; display:inline-block}
  .dot.herb{background:#7bdff2}
  .dot.omni{background:#f7b731}
  .dot.carn{background:#ff4242}
  @media (max-width:980px){
    body{ overflow:auto; overscroll-behavior:none; }
    .wrap{ height:auto; min-height:100dvh; grid-template-columns:1fr; grid-template-rows:minmax(68dvh,72dvh) auto; gap:8px; padding:8px; }
    #viewport{ border-radius:8px; }
    .panel{ height:auto; max-height:none; padding:10px; border-radius:10px; }
    .btn{ min-height:44px; padding:10px 8px; }
    .log{height:18vh}
    .toolmenu{ position:fixed; right:8px; top:auto; bottom:12px; }
  }
  @media (max-width:520px){
    .wrap{ grid-template-rows:76dvh auto; }
    h1{ font-size:.95rem; }
    .row{ gap:8px; margin:8px 0; }
    .grid2{ gap:6px; }
    .mini{ height:96px; }
    #species-cards{ max-height:20vh !important; }
  }
  .toasts{ position:fixed; top:8px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:4px; z-index:12; pointer-events:none; }
  .toast{ max-width:min(92vw,640px); background:rgba(10,18,41,0.55); border:1px solid #1b2550; color:#dbe7ff; padding:4px 8px; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.18); font-weight:600; font-size:.76rem; line-height:1.35; letter-spacing:.01em; opacity:0; transform:translateY(-6px); transition: opacity .16s ease, transform .16s ease; }
  .toast.show{ opacity:1; transform:translateY(0) }
  .toast.species{ border-color:#4fa3ff }
  .toast.season{ border-color:#8bd37b }
  .toast.event{ border-color:#ffae42 }
  .toast.cycle{ border-color:#7bdff2; background:rgba(8,18,38,0.68); }
  .species-card { padding:8px; border:1px solid #2a3352; background:#0b122a; border-radius:10px; margin-bottom:6px; }
  .species-card-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .species-avatar { width:28px; height:28px; }
  .species-key { flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .species-diet { opacity:0.8; }
  .strategy-chip{ display:inline-flex; align-items:center; gap:5px; border:1px solid rgba(125,211,252,.28); background:rgba(14,30,58,.78); color:#dbeafe; border-radius:999px; padding:2px 7px; font-size:11px; font-weight:700; }
  .strategy-line{ margin-top:4px; font-size:11px; color:#b8c7e6; line-height:1.35; }
  .strategy-line b{ color:#e7f2ff; }
  .species-stats { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .species-trend { opacity:0.8; }
  .species-bar { height:6px; background:linear-gradient(90deg, #98c0ff var(--value, 0%), rgba(255,255,255,.10) var(--value, 0%)); border-radius:4px; margin:2px 0; }
  .species-details { display:none; padding-top:6px; font-size:.9rem; color:var(--muted); }
  .water-status{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .water-status .mini-stat{ border:1px solid #1b2548; background:#081327; border-radius:8px; padding:6px 8px; min-height:42px; }
  .water-status .mini-stat b{ display:block; color:#dbeafe; font-size:.82rem; line-height:1.2; }
  .water-status .mini-stat span{ color:var(--muted); font-size:.76rem; }
  .eco-dashboard{ display:grid; gap:8px; margin-top:8px; }
  .eco-head{ display:flex; justify-content:space-between; gap:8px; align-items:center; color:#dbeafe; font-size:.82rem; }
  .eco-head .pill{ flex:0 0 auto; }
  .eco-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .eco-card{ border:1px solid #1b2548; background:#081327; border-radius:8px; padding:7px 8px; min-height:48px; }
  .eco-card b{ display:block; color:#dbeafe; font-size:.78rem; line-height:1.15; margin-bottom:4px; }
  .eco-card span{ color:var(--muted); font-size:.74rem; line-height:1.25; }
  .eco-meter{ height:6px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.10); margin-top:6px; }
  .eco-meter i{ display:block; height:100%; width:var(--value,0%); background:linear-gradient(90deg,#6ee7b7,#7dd3fc); }
  .eco-flow{ display:grid; gap:4px; font-size:.76rem; color:#b9c7e6; line-height:1.3; }
  .eco-flow div{ border:1px solid rgba(125,145,190,.22); border-radius:7px; padding:5px 7px; background:rgba(7,16,34,.48); }
  .challenge-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:7px; color:#dbeafe; font-size:.82rem; }
  .challenge-list{ display:grid; gap:6px; }
  .challenge-card{ border:1px solid rgba(125,145,190,.28); border-radius:8px; background:rgba(7,16,34,.72); padding:7px 8px; }
  .challenge-card.done{ border-color:rgba(80,250,123,.46); background:rgba(9,28,24,.70); }
  .challenge-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .challenge-name{ color:#e6eefc; font-weight:800; font-size:.78rem; line-height:1.2; }
  .challenge-desc{ color:#9fb3d1; font-size:.73rem; line-height:1.3; margin-top:3px; }
  .challenge-state{ color:#bdf; font-size:.70rem; white-space:nowrap; }
  .challenge-meter{ height:6px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.10); margin-top:6px; }
  .challenge-meter i{ display:block; height:100%; width:var(--value,0%); background:linear-gradient(90deg,#f7b731,#50fa7b); }
  #capacity-note{ margin-top:6px; color:#ffdca8; font-size:.78rem; line-height:1.35; min-height:1.2em; }
  #extinct-cards{ margin-top:8px; display:grid; gap:6px; max-height:18vh; overflow:auto; }
  .extinct-card{ border:1px solid rgba(125,145,190,.28); border-radius:8px; background:rgba(7,16,34,.72); padding:7px 8px; color:#b8c7e6; font-size:.78rem; line-height:1.35; }
  .extinct-card b{ color:#e6eefc; }
  #debug-console{position:fixed; top:0; left:0; right:0; background:rgba(0,0,0,.7); color:#fff; font:12px/1.4 monospace; padding:6px 8px; display:none; z-index:1000;}
  #fps-hud{ position:fixed; left:8px; bottom:8px; z-index:30; pointer-events:none; min-width:132px; white-space:nowrap; padding:4px 7px; border:1px solid rgba(123,223,242,.38); border-radius:8px; background:rgba(5,12,26,.62); color:#dbeafe; font:700 12px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; font-variant-numeric:tabular-nums; box-shadow:0 4px 12px rgba(0,0,0,.20); }
  #fps-hud[data-level="mid"]{ border-color:rgba(247,183,49,.46); color:#ffe8ad; }
  #fps-hud[data-level="low"]{ border-color:rgba(255,107,107,.58); color:#ffc9c9; }
  @media (max-width:520px){ #fps-hud{ position:absolute; left:6px; top:8px; bottom:auto; min-width:0; max-width:calc(100vw - 18px); font-size:10px; padding:3px 6px; opacity:.78; } }
</style>
</head>
<body>
<div id="debug-console"></div>
<div id="fps-hud" aria-live="off">FPS --</div>
<div id="toasts" class="toasts"></div>
<div class="wrap">
  <canvas id="viewport"></canvas>
  <aside class="panel">
    <h1>記号生命進化シミュレーター</h1>
    <div class="row grid2">
      <button id="start-btn" class="btn">▶ 開始</button>
      <button id="pause-btn" class="btn" disabled>⏸ 一時停止</button>
      <button id="reset-btn" class="btn">↺ リセット</button>
      <button id="tool-btn" class="btn" title="長押しでツール切替">＋ エサ追加</button>
      <button id="save-btn" class="btn">💾 セーブ</button>
      <button id="load-btn" class="btn">📂 ロード</button>
      <button id="copy-brief-btn" class="btn" style="grid-column:1 / -1">Codex用に状態コピー</button>
    </div>

    <div class="row">
      <button id="roleviz-btn" class="btn" style="width:100%">🎭 ロール色分け: OFF</button>
    </div>
    <div class="row">
      <button id="observe-btn" class="btn" style="width:100%">◎ 観察: OFF</button>
    </div>
    <div class="row">
      <button id="microview-btn" class="btn" style="width:100%">🔬 遠景観察: ON</button>
    </div>
    <div class="row">
      <button id="perf-btn" class="btn" style="width:100%">⚙ 軽量モード: OFF</button>
    </div>
    <div id="role-legend" class="legend" style="display:none; flex-wrap:wrap; margin-top:-4px; margin-bottom:6px">
      <span class="dot amb"></span><span class="hint">待ち伏せ</span>
      <span class="dot pack"></span><span class="hint">群れ狩り</span>
      <span class="dot scav"></span><span class="hint">スカベンジャー</span>
      <span class="dot filt"></span><span class="hint">濾過食</span>
      <span class="dot oth"></span><span class="hint">その他</span>
    </div>


    <div class="control">
      <label>昼夜サイクル <span id="daynight-label" class="value">昼</span></label>
      <div style="position:relative;height:10px;border:1px solid var(--panel-border);border-radius:8px;background:#0b122a;overflow:hidden">
        <div id="daynight-bar" style="position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,#ffe082,#80d8ff)"></div>
      </div>
    </div>

    <div class="control">
      <label>シミュレーション速度 <span class="value" id="speed-value">1x</span></label>
      <input id="speed-slider" type="range" min="1" max="4" step="1" value="1" />
    </div>

    <div class="control">
      <label>突然変異の強さ <span class="value" id="mutation-value">3%</span></label>
      <input id="mutation-slider" type="range" min="0" max="20" step="1" value="3" />
    </div>

    <div class="control">
      <label>個体数上限 <span class="value" id="popmax-value">120</span></label>
      <input id="popmax-slider" type="range" min="30" max="200" step="10" value="120" />
    </div>

    <div class="stats">
      <div class="stat"><div class="k">世代</div><div class="v" id="generation">1</div></div>
    </div>

    <div class="control">
      <div class="challenge-head">
        <strong>チャレンジ</strong>
        <span class="pill" id="challenge-summary">準備中</span>
      </div>
      <div id="challenge-list" class="challenge-list"></div>
    </div>

    <div class="control">
      <label>水質ステータス <span class="value" id="water-status-label">安定</span></label>
      <div id="water-status" class="water-status">
        <div class="mini-stat"><b>水質</b><span>計測中</span></div>
        <div class="mini-stat"><b>酸素</b><span>計測中</span></div>
        <div class="mini-stat"><b>栄養</b><span>計測中</span></div>
        <div class="mini-stat"><b>腐敗</b><span>計測中</span></div>
      </div>
      <div id="capacity-note"></div>
      <div id="eco-dashboard" class="eco-dashboard">
        <div class="eco-head">
          <strong>生態系ダッシュボード</strong>
          <span class="pill" id="eco-signal">観察中</span>
        </div>
        <div id="eco-meters" class="eco-grid">
          <div class="eco-card"><b>藻場</b><span>計測中</span><div class="eco-meter"><i></i></div></div>
          <div class="eco-card"><b>酸素</b><span>計測中</span><div class="eco-meter"><i></i></div></div>
          <div class="eco-card"><b>死骸片</b><span>計測中</span><div class="eco-meter"><i></i></div></div>
          <div class="eco-card"><b>分解</b><span>計測中</span><div class="eco-meter"><i></i></div></div>
        </div>
        <div id="eco-flow" class="eco-flow"></div>
      </div>
    </div>

    <div class="control">
      <label>種別シェア（リアルタイム）<span class="value pill" id="tool-pill">ツール: エサ</span></label>
      <canvas id="mix-canvas" class="mini"></canvas>
      <div class="legend">
        <span class="dot herb"></span><span class="hint">草食</span>
        <span class="dot omni"></span><span class="hint">雑食</span>
        <span class="dot carn"></span><span class="hint">肉食</span>
      </div>
    </div>

    <div class="control">
      <div class="k" style="margin:8px 0 6px; color:var(--muted)">系統ビュー <span class="hint" style="margin-left:8px">MST＝類似分布 / 系統＝血縁推定</span></div>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <button id="phy-tab-mst" class="pill" style="padding:2px 8px; border:1px solid var(--panel-border); background:var(--panel); cursor:pointer;">MST</button>
        <button id="phy-tab-lineage" class="pill" style="padding:2px 8px; border:1px solid var(--panel-border); background:#0b122a; cursor:pointer;">系統</button>
      </div>
      <canvas id="phylo-canvas" width="240" height="140" style="width:100%;height:auto; border-radius:10px; background:rgba(10,18,41,.22);"></canvas>
      <div id="species-cards" style="margin-top:8px; display:grid; grid-template-columns:1fr; gap:6px; max-height:28vh; overflow:auto;"></div>
      <div class="k" style="margin:10px 0 4px; color:var(--muted)">絶滅記録</div>
      <div id="extinct-cards"><div class="extinct-card">まだ絶滅記録はありません。</div></div>
    </div>

    <div class="control">
      <div class="k" style="margin:8px 0 6px; color:var(--muted)">進化ログ</div>
      <div id="evolution-log" class="log">Symbolic Shapes v1：図形の連なり、分岐、核、透明グラデーションで個体差を表現。</div>
      <div class="hint">※ キャンバスをタップ／クリックで選択または効果適用。長押しでツール選択。Hでリング表示。</div>
    </div>

    <div id="tool-menu" class="toolmenu">
      <button data-tool="food">🍞 エサ（既定）</button>
      <button data-tool="repel">💨 リペレント煙</button>
      <button data-tool="mutagen">☢ ミュータジェン・パルス</button>
      <button data-tool="membrane">◌ 一時壁</button>
    </div>
  </aside>
</div>

<script src="organism_render.js"></script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);

  // ===== Canvas / Context =====
  const view = $('viewport');
  const ctx = view.getContext('2d', { alpha:false });
  const IS_MOBILE_VIEW = window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
  const DPR_CAP = IS_MOBILE_VIEW ? 1.12 : 1.35;
  let W=0,H=0; const DPR=Math.min(DPR_CAP, Math.max(1, window.devicePixelRatio||1));
  function resize(){ const r=view.getBoundingClientRect(); W=r.width; H=r.height; view.width=Math.round(W*DPR); view.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); if(window.env) window.env.ensure(); }
  window.addEventListener('resize',resize,{passive:true}); resize();
  const TAU=Math.PI*2; const rnd=(a,b)=>Math.random()*(b-a)+a; const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const clamp01=(x)=>clamp(x,0,1); const lerp=(a,b,t)=>a+(b-a)*t; const sigmoid=x=>1/(1+Math.exp(-x));
  const hash01 = (s)=>{ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0)/2**32; };

  // ===== Design config =====
  // Keep tuning and ecology ledgers in one place before deeper model/render/ui splits.
  const CONFIG = Object.freeze({
    population: Object.freeze({
      starter: 64,
      maxDefault: 120,
      reseedMin: 36,
      reseedRatio: 0.65
    }),
    organism: Object.freeze({
      movementSpeedScale: 0.25,
      maxSizeScale: IS_MOBILE_VIEW ? 2.0 * 0.7 : 2.0
    }),
    rendering: Object.freeze({
      tinyEnterPop: 118,
      tinyExitPop: 96,
      mobileTinyEnterPop: 96,
      mobileTinyExitPop: 72,
      maxSparks: 190,
      maxRings: 130,
      maxPredationBlooms: 36,
      maxCurrents: 90,
      maxMembranes: 90,
      planktonVisualScale: 0.5,
      starvationParticleScale: 0.5,
      starvationParticleAlpha: 0.5,
      symbolSpriteCacheLimit: 1800,
      symbolSpriteMaxSide: 224,
      symbolSpriteGaitBuckets: 4,
      microView: Object.freeze({
        baseScale: 0.34,
        rareScale: 0.48,
        discoveryScale: 0.72,
        selectedScale: 1.0
      })
    }),
    ecology: Object.freeze({
      wildFoodSpawnScale: 0.02,
      rescueFood: Object.freeze({
        enabled: true,
        minPopulation: 42,
        minAverageEnergy: 42,
        maxFoodParticles: 7,
        cooldownFrames: 240,
        small: 4,
        big: 0
      }),
      predatorBurst: Object.freeze({
        role: 'ambusher',
        dietMin: 0.66,
        triggerSenseScale: 0.62,
        frames: 22,
        speedMultiplier: 1.65,
        energyCost: 0.012
      }),
      plankton: Object.freeze({
        source: 'detritus-oxygen',
        initialSeed: 70,
        baseCap: 42,
        detritusCapScale: 260,
        nightCapBonus: 26,
        oxygenMin: 0.32,
        detritusSpawnThreshold: 0.075,
        detritusCost: 0.016,
        oxygenCost: 0.004
      }),
      photosynthesis: Object.freeze({
        oxygenRelease: 0.0016,
        calmMultiplier: 1.0,
        movingMultiplier: 0.42
      }),
      initialRoleShare: Object.freeze({ ambusher:0, pack:0, scav:0, filter:0, other:1 }),
      initialDietShare: Object.freeze({ h:0.34, m:0.33, c:0.33 }),
      roleFoodLedger: Object.freeze({
        filter: Object.freeze({ main:'plankton', secondary:'algae' }),
        grazer: Object.freeze({ main:'algae', secondary:null }),
        scav: Object.freeze({ main:'corpse-detritus', secondary:'algae' }),

  function symbolSpriteGeometrySignature(o,sym){

    let s = `${o.speciesKey||speciesKey(o.genes)}:${Math.round((o.genes.formSeed||0)*1009)}:${sym.bodyPlan||o.morphologyTopology||'single'}:${nodes.length}:${links.length}`;
    for(const n of nodes){
      s += `|${Math.round(n.x*2)},${Math.round(n.y*2)},${Math.round(n.r*2)},${n.shape},${n.parent},${n.kind||''}`;
    }
    for(const l of links) s += `>${l.a},${l.b},${l.kind||''}`;
    sym._spriteSignature = `${o.speciesKey||speciesKey(o.genes)}:${Math.round((o.genes.formSeed||0)*1009)}:${Math.round(hash01(s)*0xffffffff).toString(36)}`;

    const cached = symbolSpriteCache.get(key);
    if(cached){

    symbolSpriteStats.misses++;
    const visualR = Math.max(o.size||1, sym.visualR||o.size||1);

  function checkEvolutionMilestones(){
    const total=organisms.length;
    if(total<12) return;
    if(frame<speciesAnnounceMuteUntil) return;
    const speciesN=new Set(organisms.map(o=>o.speciesKey)).size;
    if(speciesN>=8) announceEvolutionMilestone('diversity:8', '現存種が8種を超え、培地の多様性が広がった');
    if(speciesN>=14) announceEvolutionMilestone('diversity:14', '現存種が14種を超え、小さな生態系らしく枝分かれした');
    const adaptationCounts=new Map();
    const topologyCounts=new Map();
    for(const o of organisms){
      const topo=o.morphologyTopology||topologyFromGenes(o.genes);
      topologyCounts.set(topo,(topologyCounts.get(topo)||0)+1);
      for(const tag of adaptationProfilesFromGenes(o.genes,o.flags,topo,o.role)){
        adaptationCounts.set(tag,(adaptationCounts.get(tag)||0)+1);
      }
    }
    for(const [tag,count] of adaptationCounts){
      const share=count/total;
      const label=ADAPTATION_BY_ID[tag]?.label||tag;
      if(count>=3 && share>=0.08) announceEvolutionMilestone(`adapt:${tag}:seed`, `${label}が定着しはじめた`);
      if(count>=8 && share>=0.22) announceEvolutionMilestone(`adapt:${tag}:rise`, `${label}が個体群の一角を占めた`);
      if(share>=0.42) announceEvolutionMilestone(`adapt:${tag}:dominant`, `${label}が優勢になった`);
    }
    for(const [topo,count] of topologyCounts){
      const share=count/total;

    }
  }

            this.storeN = clamp((this.storeN||0) + 0.040*(gain/40), 0, 1);
            recordFoodUse('plankton',this,gain,1);
            if(eaten===0) recordAction(this,'プランクトンを濾過した');
            plankton.splice(i,1);
            if(++eaten>=3) break;
          }
        }
      }

      // 捕食
      this.tryPredate();

      // エネルギー消費
      const moveCost=0.03*(this.vx*this.vx + this.vy*this.vy);
      let neigh=0; forEachOrgNeighbors(this.x,this.y,35,(o)=>{ if(o!==this) neigh++; });
      const crowdEase = (this.socialMode==='cluster'||this.socialMode==='school'||this.socialMode==='hunt-pack'||this.socialMode==='defense-school') ? (1 - 0.42*(this.sociality||0)) : 1;
      const densityCost=0.0042*neigh*clamp(crowdEase,0.50,1);

      // chloroplast trait: in daytime, calm herbivores can suppress basal metabolism (survival only)
      let baseMeta = (this.baseMetabolic*metaMul*worldEvent.metaMul);
      if(isPhotosynthetic){
        const sp2 = this.vx*this.vx + this.vy*this.vy;
        const calm = sp2 < (0.18*0.18);
        baseMeta *= (calm ? 0.10 : 0.30);
      }

      const totalCost=(baseMeta + moveCost + (this.senseCost*senseMul*(worldEvent.senseCostMul||1)) + densityCost);
      this.energy-=totalCost; this.moveCostSum+=moveCost; this.age++; this.phase += 0.012 + 0.035*(this.motionLevel||0); this.fitness += 0.002;

      // 繁殖
      if(this.energy>this.reproThreshold){
        // seeking state
        this.mateSeekT++; if(this.callCD>0) this.callCD--;
        // emit species-specific short-lived call (beacon) occasionally
        if(this.mateSeekT>120 && this.callCD<=0){
          calls.push({x:this.x, y:this.y, r: 100, t: 180, maxT:180, speciesKey:this.speciesKey});
          this.callCD = 240; // cooldown
        }
        const p0=0.03; let p=p0*sigmoid((this.energy-this.reproThreshold)/8.0); p*= (1 + 0.18*fieldFavor)*(1 - 0.42*dirty); p*= clamp((Et-0.16)/0.48, 0.03, 1.18);
        // additional gates: local nutrients + body condition + internal stores (mild)
        if(this.mem!==undefined){
          p *= clamp(0.65 + 0.74*En, 0.28, 1.35);
          p *= clamp(0.48 + 0.56*this.mem, 0.18, 1.08);
          p *= clamp(0.72 + 0.30*clamp01(this.storeN*3.0), 0.42, 1.06);
          p *= clamp(0.62 + 0.44*clamp01(this.storeO*3.0), 0.34, 1.08);
          p *= clamp(1.00 - 0.62*clamp01(this.storeD*3.0), 0.20, 1.0);
        }
        p*= (worldEvent.reproT>0 ? worldEvent.reproMul : 1);
        if(Math.random()<p){ const kids=this.tryReproduce(); if(kids && kids.length){ newborn.push(...kids); recordAction(this,`繁殖した（${kids.length}個体）`); this.mateSeekT=0; } }
      } else {
        this.mateSeekT=0; this.callCD=0;
      }

      // 死亡
      // chloroplast trait: daytime survival when staying calm (no extra energy gain)
      if(this.energy<=0 && isPhotosynthetic){
        const sp2 = this.vx*this.vx + this.vy*this.vy;
        if(sp2 < (0.18*0.18)){
          this.energy = 0.5;
        }
      }
      if(this.energy<=0){ const corpseE = 0.45*(8*this.size); corpses.push(new Corpse(this.x,this.y,corpseE)); eco.detritusMeter += corpseE; sparks.push(new Spark(this.x,this.y,0.9*CONFIG.rendering.starvationParticleScale,'rgba(120,200,255,',CONFIG.rendering.starvationParticleAlpha)); this.deathCause='飢餓'; recordDeath(this,'飢餓'); this.dead=true; }
      else if(this.age>12000){ const corpseE = 0.45*(0.6*this.energy + 8*this.size); corpses.push(new Corpse(this.x,this.y,corpseE)); eco.detritusMeter += corpseE; this.deathCause='老化'; recordDeath(this,'老化'); this.dead=true; }
    }

    tryPredate(){
      if(this.attackCD>0) return;
      const carnIntent=this.genes.diet;
      if(carnIntent<0.34) return;
      let repelHere=false;
      for(const e of effects){
        if(e.type!=='repel') continue;
        const dx=e.x-this.x, dy=e.y-this.y;
        if(dx*dx+dy*dy < e.r*e.r){ repelHere=true; break; }
      }
      const deficit=Math.max(0, this.reproThreshold*1.04 - this.energy);
      let intent=dietIntent(carnIntent, deficit);
      if(repelHere) intent*=0.2;
      if(intent<0.05) return;
      let prey=organismById(this.preyTargetId);
      let bestD2=Infinity;
      const canEat=(o)=> o && o!==this && !o.dead && o.protect<=0 && o.size < this.size*(this.socialMode==='hunt-pack'?1.13:1.00);
      if(!canEat(prey)){
        prey=null;
        perfStats.predationScans++;
        forEachOrgNeighbors(this.x,this.y,Math.max(this.size*3.8,32),(o,dx,dy,d2)=>{
          if(!canEat(o)) return;
          const rr=(this.size+o.size+2.8);
          if(d2<bestD2 && d2 <= rr*rr){ bestD2=d2; prey=o; }
        });
      } else {
        const dx=prey.x-this.x, dy=prey.y-this.y;
        bestD2=dx*dx+dy*dy;
      }
      if(!prey) return;
      const contactR=this.size+prey.size+3.8;
      if(bestD2>contactR*contactR) return;
      let pBase=0.26;
      const sizeEdge=clamp((this.size-prey.size)/Math.max(1,this.size),0,0.55);
      let p=clamp(pBase*(0.72+sizeEdge*0.95)*intent,0,0.74);
      if(this.preyTargetId===prey.id) p*=1.18;
      if(this.morphologyTopology==='radial') p*=1.10;
      if(prey.morphologyTopology==='ring') p*=0.82;
      if(prey.morphologyTopology==='mesh') p*=0.90;
      if(repelHere) p*=0.5;
      if(this.role==='ambusher'){ p*= 1.0*rareFactor('ambusher'); if(this.burstTimer>0) p*=1.22; }
      if(this.role==='pack' || this.socialMode==='hunt-pack'){
        let mates=0;
        forEachOrgNeighbors(prey.x,prey.y,76,(o2)=>{ if(o2!==this && o2.speciesKey===this.speciesKey && (o2.role==='pack' || o2.socialMode==='hunt-pack')) mates++; });
        p*= (0.78 + 0.095*mates) * rareFactor('pack');
      }
      const preyDefenses=predationDefensesFor(prey);
      for(const d of preyDefenses){
        const fx=d.defense;
        p*=fx.avoidMul??1;
        if(this.role==='ambusher') p*=fx.ambusherAvoidMul??1;
      }
      p*=prey.predationRiskMul||1;
      p*= (worldEvent.predSuccessMul||1);
      if(prey.socialMode==='defense-school'){
        let herd=0, screen=0;
        const preyToPred=Math.hypot(prey.x-this.x,prey.y-this.y)||1;
        forEachOrgNeighbors(prey.x,prey.y,82,(ally,dx,dy,d2)=>{
          if(ally===prey || ally.dead || !ally.genes || ally.genes.diet>0.40) return;
          if(!canUseGroupStrategy(ally.genes)) return;
          if(ally.speciesKey!==prey.speciesKey) return;
          herd++;
          const allyToPred=Math.hypot(ally.x-this.x,ally.y-this.y)||1;
          if(allyToPred<preyToPred && Math.sqrt(d2)<54) screen++;
          ally.fleeTimer=Math.max(ally.fleeTimer||0,18);
          ally.herdThreat=Math.max(ally.herdThreat||0,30);
        });
        if(herd>0){
          p *= clamp(1 - 0.072*Math.min(7,herd) - 0.035*Math.min(5,screen), 0.40, 1.0);
          prey.fleeTimer=Math.max(prey.fleeTimer||0,34);
          prey.herdThreat=Math.max(prey.herdThreat||0,42);
        }
      }
      if(Math.random()<p){
        const carn=this.genes.diet;
        const diet=dietTypeFromCarn(carn);
        const gainRaw=0.6*prey.energy + 8*prey.size;
        const rf=(this.role==='ambusher')? rareFactor('ambusher') : (this.role==='pack'? rareFactor('pack') : 1.0);
        const gain=gainRaw*rf*meatDigestFactor(carn)*dietRareFactor(diet)*(diet==='c'?1.0:(diet==='m'?0.92:0.80));
        const cost=6 + 0.05*this.maxSpeed*this.maxSpeed;
        this.energy=clamp(this.energy + gain - cost, 0, 160);
        applyPredationDefenses(this,prey,preyDefenses,gainRaw);
        this.fitness+=0.6;
        recordFoodUse('prey',this,gain,1);
        prey.dead=true;
        prey.deathCause='捕食';
        recordDeath(prey,'捕食');
        recordAction(this, `${topologyLabel(prey.morphologyTopology||topologyFromGenes(prey.genes))}を捕食した`);
        const scale=clamp((gain/60),0.6,2.0);
        const corpseE=gainRaw*0.32;
        eco.detritusMeter += corpseE;
        if(window.env && window.env.addDetritusAt) window.env.addDetritusAt(prey.x,prey.y,0.004 + 0.004*scale);
        shedCorpseDetritus({x:prey.x,y:prey.y,energy:corpseE,radius:Math.max(2,prey.size*0.55)}, 1 + Math.round(scale));
        spawnPredationScatter(prey,this,scale);
        pushPredationBloom(prey,this,scale);
        pushRing(prey.x,prey.y,{r0:4,r1:34*scale,color:'rgba(255,130,120,',t:44,width:1.7});
        if((predEvents%5)===0) log(`捕食：${topologyLabel(this.morphologyTopology)}が${topologyLabel(prey.morphologyTopology||topologyFromGenes(prey.genes))}を捕食。`);
        this.attackCD=105;
        this.chaseTimer=0;
        this.preyTargetId=null;
        predEvents++;
        peaceCounter=0;
      }
      else {
        const dx=(prey.x-this.x), dy=(prey.y-this.y);
        const d=Math.hypot(dx,dy)||1;
        prey.vx += (dx/d)*0.85;
        prey.vy += (dy/d)*0.85;
        prey.fleeTimer=Math.max(prey.fleeTimer||0,38);
        if(!notePredationRepelled(this,prey,preyDefenses)){
          recordAction(prey,'捕食を逃れた');
          recordAction(this,'捕食に失敗した');
        }
        pushRing(prey.x,prey.y,{r0:3,r1:24,color:'rgba(185,230,255,',t:34,width:1.3});
        this.attackCD=34;
      }
    }

    tryReproduce(){
      // dynamic search radius expands with mate-seeking time
      let r = 50 + Math.min(70, this.mateSeekT * 0.20);
      let mate=null, bestD2=r*r;
      forEachOrgNeighbors(this.x,this.y,r,(o,dx,dy,d2)=>{
        if(o===this || o.energy<o.reproThreshold) return;
        // same-species only
        if(o.speciesKey !== this.speciesKey) return;
        if(d2<bestD2){ bestD2=d2; mate=o; }
      });
      const baseMut=ui.mutation + (this.mutagenBoost>0? 0.08: 0);
      const pick=(a,b)=>Math.random()<0.5?a:b;
      const kids=[];
      const isSex = !!mate;

      // clutch size: species-level potential (max up to 9), actual is biased toward 1–2
      const rp = getSpeciesReproParams(this.speciesKey);
      let clutch = 1;
      let pUp = rp.upP;
      while(clutch < rp.clutchMax && Math.random() < pUp){
        clutch++;
        pUp *= rp.decay;
      }
      clutch = Math.max(1, Math.min(rp.clutchMax, clutch));

      for(let i=0;i<clutch;i++){
        let g;
        if(isSex){
          g={}; for(const k of GENE_KEYS){ g[k]=pick(this.genes[k],mate.genes[k]); }
          for(const k of Object.keys(g)){ g[k]=clamp(g[k]+(Math.random()-0.5)*baseMut,0,1); }
        } else {
          g=Object.assign({}, this.genes);
          for(const k of Object.keys(g)){ g[k]=clamp(g[k]+(Math.random()*2-1)*baseMut,0,1); }
        }
        const childSpread = adaptationProfilesFromGenes(this.genes, this.flags, this.morphologyTopology, this.role).includes('colonyBuilder') ? 8 : 20;
        const c=new Organism(clamp(this.x+rnd(-childSpread,childSpread),10,W-10), clamp(this.y+rnd(-childSpread,childSpread),10,H-10), g, true, this.speciesKey, mate?.speciesKey||null);
        c.vx=this.vx*0.2; c.vy=this.vy*0.2;

        // Mendelian flags inheritance (glow/crown/colony)
        try{
          const mutRate = 0.005 + (this.mutagenBoost>0?0.004:0);
          c.traits = __inheritTraits(this.traits, mate?.traits, mutRate);
          c.flags = __flagsFromTraits(c.traits, c.genes);
          recordRareTraitDiscovery(c);
          registerSpeciesStats(c);
}catch(_){ /* ignore */ }
        if(c._wasNewSpecies) announceNewSpecies(c);

        // protection scaling for multi-birth
        c.protect = Math.max(40, 90 - 20*i);
        kids.push(c);
      }

      // Energy cost handled here (remove outside energy cut)
      let mult;
      if(clutch===1) mult = 0.55;
      else if(clutch===2) mult = 0.40;
      else if(clutch===3) mult = 0.30;
      else mult = 0.30 * Math.pow(3/clutch, 0.9);
      this.energy *= mult;

      // fecundity leaves waste (clutch = heavier load)
      const reproD = 0.010 + 0.004*clutch;
      this.storeN = clamp((this.storeN||0) - (0.06 + 0.02*(clutch-1)), 0, 1);
      if(window.env && window.env.addDetritusAt) window.env.addDetritusAt(this.x,this.y, reproD);

      // optional: mild cost to mate as well (scale slightly with clutch)
      if(isSex){
        const mm = (clutch<=2)? 0.92 : (clutch<=4? 0.88 : 0.84);
        mate.energy *= mm;
      }

      return kids;
    }

    symbolShapePath(c, shape, r){ return OrganismRender.symbolShapePath(c, shape, r); }

    drawTinySymbolic(){
      const topo=this.morphologyTopology||topologyFromGenes(this.genes);
      const sym = this._symbol || (this.prepareSymbolDetails(), this._symbol) || {};
      const shapeNames = sym.shapeNames || ['circle'];
      const shape = shapeNames[sym.primaryIndex || 0] || 'circle';
      const shapeRot = sym.shapeRot || 0;
      const hue=ui.roleViz ? (ROLE_HUE[this.role] ?? this.hue ?? 190) : (this.hue||190);
      const visualScale=organismVisualScale(this);
      const r=Math.max(2.2,this.size*0.74);
      const pts=[];
      if(topo==='chain'){
        for(let i=0;i<4;i++){ const q=i/3-0.5; pts.push({x:q*r*4.0,y:Math.sin(this.gait+i)*r*0.55,rr:r*(0.92-i*0.035)}); }
      } else if(topo==='amoeba'){
        pts.push({x:0,y:0,rr:r*1.00});
        for(let i=0;i<5;i++){ const a=i/5*TAU + Math.sin(this.gait*0.25+i)*0.18; const rad=r*(1.05 + 0.28*Math.sin(i*1.7)); pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,rr:r*(0.48+0.14*(i%2))}); }
      } else if(topo==='ring'){
        for(let i=0;i<6;i++){ const a=i/6*TAU; pts.push({x:Math.cos(a)*r*1.65,y:Math.sin(a)*r*1.35,rr:r*0.72}); }
      } else if(topo==='radial'){
        pts.push({x:0,y:0,rr:r*0.88});
        for(let i=0;i<5;i++){ const a=i/5*TAU; pts.push({x:Math.cos(a)*r*1.75,y:Math.sin(a)*r*1.75,rr:r*0.58}); }
      } else if(topo==='branch'){
        pts.push({x:-r*1.3,y:0,rr:r*0.75},{x:0,y:0,rr:r*0.72},{x:r*1.25,y:-r*0.95,rr:r*0.60},{x:r*1.25,y:r*0.95,rr:r*0.60});
      } else if(topo==='cluster' || topo==='mesh'){
        pts.push({x:0,y:0,rr:r*0.76});
        for(let i=0;i<6;i++){ const a=i/6*TAU; const rad=r*(topo==='mesh'?1.35:1.05); pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,rr:r*0.52}); }
      } else {
        pts.push({x:0,y:0,rr:r*1.05});
      }
      ctx.save();
      ctx.translate(this.x,this.y);
      if(ui.microView && visualScale>CONFIG.rendering.microView.baseScale+0.03){
        ctx.beginPath();
        ctx.arc(0,0,Math.max(4,r*3.2*visualScale),0,TAU);
        ctx.strokeStyle=`hsla(${hue},92%,86%,${this===selectedOrganism?0.32:0.16})`;
        ctx.lineWidth=1;
        ctx.stroke();
      }
      ctx.scale(visualScale,visualScale);
      ctx.rotate(Number.isFinite(this.heading) ? this.heading : 0);
      ctx.lineCap='round';
      ctx.lineJoin='round';
      if(pts.length>1){
        ctx.strokeStyle=`hsla(${hue},72%,78%,0.24)`;
        ctx.lineWidth=Math.max(1,r*0.28);
        ctx.beginPath();
        for(let i=1;i<pts.length;i++){
          ctx.moveTo(pts[0].x,pts[0].y);
          ctx.lineTo(pts[i].x,pts[i].y);
        }
        ctx.stroke();
      }
      for(const p of pts){
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(shapeRot);
        ctx.fillStyle=`hsla(${hue},76%,58%,0.62)`;
        this.symbolShapePath(ctx, shape, p.rr);
        ctx.fill();
        ctx.strokeStyle=`hsla(${hue},88%,86%,0.42)`;
        ctx.lineWidth=Math.max(0.7,p.rr*0.13);
        this.symbolShapePath(ctx, shape, p.rr);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,Math.max(0.55,p.rr*0.24),0,TAU);
        ctx.fillStyle=`hsla(${(hue+140)%360},86%,78%,0.72)`;
        ctx.fill();
        ctx.restore();
      }
      if(this.flags?.glow && dayNight.isNight){
        ctx.beginPath(); ctx.arc(0,0,r*3.0,0,TAU);
        ctx.strokeStyle=`hsla(${hue},95%,84%,0.25)`;
        ctx.lineWidth=1;
        ctx.stroke();
      }
      const predatorBursting=isPredatorBursting(this);
      if(this.chaseTimer>0 || this.preyTargetId){
        ctx.beginPath(); ctx.arc(0,0,r*3.1,0,TAU);
        ctx.strokeStyle=predatorBursting?'rgba(255,170,90,0.48)':'rgba(255,118,126,0.30)';
        ctx.lineWidth=predatorBursting?1.6:1.1;
        ctx.stroke();
      }
      if(this.fleeTimer>0){
        ctx.beginPath(); ctx.arc(0,0,r*2.8,0,TAU);
        ctx.strokeStyle='rgba(172,235,255,0.30)';
        ctx.lineWidth=1.1;
        ctx.stroke();
      }
      ctx.restore();
    }

    drawSymbolicLive(c=ctx,bake=null){ return OrganismRender.drawOrganism(this, c, bake, {ADAPTATION_BY_ID, CONFIG, ROLE_HUE, adaptationProfilesFromGenes, clamp, clamp01, dayNight, formFromGenes, isPredatorBursting, lerp, organismVisualScale, renderPerf, selectedOrganism, ui}); }

    drawSymbolicSpriteRings(sym, visualScale){
      const nodes = sym.nodes || [];

        ctx.strokeStyle=predatorBursting?'rgba(255,170,90,0.52)':'rgba(255,118,126,0.34)';
        ctx.lineWidth=predatorBursting?1.8:1.4;
        ctx.stroke();
      }
      if(this.fleeTimer>0){
        const fk=clamp(this.fleeTimer/42,0,1);

        ctx.arc(0,0,Math.max(this.size*1.65,(sym.visualR||this.size)*0.72)*(1.0+0.18*Math.sin(gait*0.8)),0,TAU);
        ctx.strokeStyle=`rgba(172,235,255,${0.16+0.20*fk})`;

      const rX=rx*(1+wave), rY=ry*(1+wave);
      const x=cx + Math.cos(t)*rX, y=cy + Math.sin(t)*rY;
      d += (i===0? `${x.toFixed(2)} ${y.toFixed(2)}` : ` L ${x.toFixed(2)} ${y.toFixed(2)}`);

  function drawPhy(){
    try {
      const cvs = $('phylo-canvas');
      if(!cvs) return;
      const c = cvs.getContext('2d');
      const w = cvs.width, h = cvs.height;
      c.clearRect(0,0,w,h);
      c.fillStyle='rgba(12,16,28,0.25)';
      c.fillRect(0,0,w,h);
      c.font='11px system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
      c.fillStyle='#9fb3d1';
      c.fillText('MST（類似分布）', 8, 14);

      // 現在の種ごとの平均
      const sums=new Map();
      for(const o of organisms){
        const k=o.speciesKey; let s=sums.get(k);
        if(!s){ s={n:0, g:{speed:0,size:0,eff:0,repro:0,sens:0,carn:0}}; sums.set(k,s); }
        s.n++; s.g.speed+=o.genes.speed; s.g.size+=o.genes.size; s.g.eff+=o.genes.metabolism; s.g.repro+=o.genes.fecundity; s.g.sens+=o.genes.sense; s.g.carn+=o.genes.diet;
      }
      const nodes=[];
      sums.forEach((s,k)=>{
        const n=s.n; if(n<=0) return;
        const g={speed:s.g.speed/n,size:s.g.size/n,eff:s.g.eff/n,fecundity:s.g.repro/n,sense:s.g.sens/n,diet:s.g.carn/n};

      });
      nodes.sort((a,b)=>b.n-a.n);
      const top=nodes.slice(0,40);

      const pad=14, ww=w-pad*2, hh=h-pad*2-8;

      if(phyMode==='mst'){
        const edges=[];
        if(top.length>=2){
          const vis=new Set([0]);
          while(vis.size<top.length){
            let bestI=-1,bestJ=-1,bestD=1e9;
            for(const i of vis){
              for(let j=0;j<top.length;j++){
                if(vis.has(j)) continue;
                const a=top[i].g, b=top[j].g;
                const d=(a.speed-b.speed)**2+(a.size-b.size)**2+(a.eff-b.eff)**2+(a.fecundity-b.fecundity)**2+(a.sense-b.sense)**2+(a.diet-b.diet)**2;

      patches: patches.map(p=>({type:p.type,x:p.x,y:p.y,r:p.r})),
      plankton: plankton.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,t:p.t,kind:p.kind,fade:p.fade})),
      membranes: membranes.map(m=>({x1:m.x1,y1:m.y1,x2:m.x2,y2:m.y2,type:m.type,t:m.t})),
      organisms: organisms.map(o=>({x:o.x,y:o.y,vx:o.vx,vy:o.vy,energy:o.energy,age:o.age,genes:o.genes,speciesKey:o.speciesKey,traits:o.traits||null,flags:o.flags||null,morphologyTopology:o.morphologyTopology||topologyFromGenes(o.genes),recentEvents:o.recentEvents||[],lastAction:o.lastAction||null})),
      extinctRecords,
      speciesStats:Array.from(speciesStats.entries()),
      discoveredRareTraits:Array.from(discoveredRareTraits),
      evolutionMilestones:Array.from(evolutionMilestones),
      lineage: { nodes: Array.from(lineage.nodes.entries()), edges: lineage.edges }
    };
    return 'ALIFE2:'+ btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  }
  function restore(s){
    try{
      if(!s.startsWith('ALIFE2:')) throw new Error('ヘッダー不正');
      const body=s.split(':',2)[1]; const state=JSON.parse(decodeURIComponent(escape(atob(body))));
      running=false;
      food.length=0; corpses.length=0; plankton.length=0; patches.length=0; organisms.length=0; sparks.length=0; effects.length=0; rings.length=0; predationBlooms.length=0; waterCurrents.length=0; membranes.length=0; speciesCount.clear(); speciesStats.clear(); extinctRecords.length=0; discoveredRareTraits.clear(); evolutionMilestones.clear(); selectedOrganism=null; selectedDeadAt=0;
      resetFoodWebStats();
      (state.patches||[]).forEach(p=>patches.push(new Patch(p.type,p.x,p.y,p.r)));
      (state.food||[]).forEach(f=>{
        const q=new Food(f.x,f.y,f.type);
        if(f.r!=null) q.r=f.r;
        if(f.gain!=null) q.gain=f.gain;
        if(f.t!=null) q.t=f.t;
        if(f.vx!=null) q.vx=f.vx;
        if(f.vy!=null) q.vy=f.vy;
        if(f.seed!=null) q.seed=f.seed;
        food.push(q);
      });
      (state.corpses||[]).forEach(c=>{ const q=new Corpse(c.x,c.y,c.energy); if(c.t!=null) q.t=c.t; corpses.push(q); });
      (state.plankton||[]).forEach(p=>{ const q=new Plankton(); q.x=p.x;q.y=p.y;q.vx=p.vx;q.vy=p.vy;q.t=p.t; if(p.kind!=null) q.kind=p.kind; q.fade=p.fade!=null ? p.fade : 1; plankton.push(q); });
      (state.membranes||[]).forEach(m=>{ const q=new MembraneSegment(m.x1,m.y1,m.x2,m.y2,'wall'); if(m.t!=null) q.t=m.t; membranes.push(q); });
      const prevAnnounceMute=speciesAnnounceMuteUntil;
      speciesAnnounceMuteUntil=Number.MAX_SAFE_INTEGER;
      (state.organisms||[]).forEach(o=>{
        const u=new Organism(o.x,o.y,o.genes,false);
        u.vx=o.vx; u.vy=o.vy; u.energy=o.energy; u.age=o.age;
        if(o.traits) u.traits=o.traits;
        // recompute flags to include any new trait logic (backward compatible)
        u.flags = __flagsFromTraits(u.traits||{}, u.genes);
        u.morphologyTopology = o.morphologyTopology || topologyFromGenes(u.genes);
        u.recentEvents = Array.isArray(o.recentEvents) ? o.recentEvents.slice(-5) : [];
        u.lastAction = o.lastAction || u.lastAction || 'ロードされた';
        recordRareTraitDiscovery(u);
        registerSpeciesStats(u);
organisms.push(u);
      });
      frame=state.frame||0; generation=state.generation||1; if(state.dayNight?.phase!=null){ dayNight.phase=state.dayNight.phase; applyDayNightState(false); } Object.assign(worldEvent, state.worldEvent||{}); Object.assign(eco, state.eco||{});
      speciesAnnounceMuteUntil=Math.max(prevAnnounceMute||0, frame+120);
      if(Array.isArray(state.extinctRecords)) extinctRecords.push(...state.extinctRecords.slice(0,14));
      if(Array.isArray(state.discoveredRareTraits)){ for(const x of state.discoveredRareTraits) discoveredRareTraits.add(x); }
      if(Array.isArray(state.evolutionMilestones)){ for(const x of state.evolutionMilestones) evolutionMilestones.add(x); }
      if(Array.isArray(state.speciesStats)){ for(const [k,v] of state.speciesStats) speciesStats.set(k,v); }
      // lineage
      lineage.nodes.clear(); lineage.edges.length=0;
      if(state.lineage){ for(const [k,v] of (state.lineage.nodes||[])){ lineage.nodes.set(k,v); } lineage.edges.push(...(state.lineage.edges||[])); }
      reportMix(); rebuildSpeciesCards(); renderExtinctRecords(); updateWaterStatus();
      showToast('season','✔ ロード完了');
    }catch(e){ alert('ロード失敗: '+(e?.message||e)); }
  }
  function buildCodexBrief(){
    const species = new Set(organisms.map(o=>o.speciesKey));
    const roles = {ambusher:0, pack:0, scav:0, filter:0, other:0};
    let motionSum = 0;
    for(const o of organisms){
      roles[o.role] = (roles[o.role]||0) + 1;
      motionSum += o.motionLevel || 0;
    }
    const topSpecies = Array.from(speciesCount.entries())
      .filter(([,n])=>n>0)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,5)
      .map(([k,n])=>`${k}:${n}`)
      .join(', ') || 'none';
    const topologies = {};
    for(const o of organisms){ const t=o.morphologyTopology||topologyFromGenes(o.genes); topologies[t]=(topologies[t]||0)+1; }
    const rareSeen = Array.from(discoveredRareTraits).join(', ') || 'none';
    return [
      'ALIFE symbolic shapes v1 状態メモ',
      'ファイル: alife_symbolic_shapes_v1.html',
      `個体数: ${organisms.length}`,
      `現存種数: ${species.size}`,
      `世代: ${generation}`,
      `昼夜: ${dayNight.isNight ? '夜' : '昼'}`,
      `水質: ${JSON.stringify(window.env?.getAverages ? waterStatusFromAverages(window.env.getAverages()) : {})}`,
      `トポロジー: ${Object.entries(topologies).map(([k,v])=>`${k}:${v}`).join(', ')}`,
      `発見済み希少形質: ${rareSeen}`,
      `平均運動量: ${organisms.length ? (motionSum/organisms.length).toFixed(2) : '0.00'}`,
      `描画モード: ${renderPerf.mode} / mesh=${renderPerf.meshCount} / complex=${renderPerf.complexCount} / heavy=${renderPerf.heavyComplex ? 'yes' : 'no'}`,
      `性能: FPS=${Math.round(fpsMeter.fps)}, update=${perfStats.updateMs.toFixed(1)}ms, draw=${perfStats.drawMs.toFixed(1)}ms, neighbor=${perfStats.neighborQueriesLast}, predScan=${perfStats.predationScansLast}`,
      `ロール: ambusher=${roles.ambusher||0}, pack=${roles.pack||0}, scav=${roles.scav||0}, filter=${roles.filter||0}, other=${roles.other||0}`,
      `上位種: ${topSpecies}`,
      '',
      '気になった見た目/動き:',
      ''
    ].join('\n');
  }
  async function copyPlainText(text, okMessage){
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      ta.remove();
    }
    showToast('season', okMessage);
  }
  $('copy-brief-btn').addEventListener('click',async()=>{ 
    await copyPlainText(buildCodexBrief(), 'Codex用の状態メモをコピーしました');
  });

  $('save-btn').addEventListener('click',async()=>{ 
    const data=capture(); 
    try{ 
      await navigator.clipboard.writeText(data); 
      showToast('season','セーブデータをクリップボードにコピーしました'); 
    }catch(e){ 
      const ta=document.createElement('textarea'); 
      ta.value=data; 
      document.body.appendChild(ta); 
      ta.select(); 
      try{ document.execCommand('copy'); }catch(_){} 
      ta.remove(); 
      showToast('season','セーブデータをテキストエリアにコピーしました');
    } 
  });
  $('load-btn').addEventListener('click',()=>{ 
    const s=prompt('セーブ文字列を貼り付け（ALIFE2:）'); 
    if(s) restore(s.trim()); 
  });

  // ===== Boot =====
  function boot(){ 
    try {
      toastBlockUntil = frame + 600; 
      speciesAnnounceMuteUntil = frame + 600;
      initPopulation(CONFIG.population.starter);
      seedPatches(); 
      if(window.env) window.env.seedFromPatches(patches);
      seedPlankton(); 
      addFood(10,2,'initialFood');
      reportMix(); 
      updateWaterStatus();
      refreshSpeciesStats();
      $('start-btn').disabled=false; 
      $('pause-btn').disabled=true; 
      initChallenges(); 
      log('◆ Symbolic Shapes v1: 図形の連なり・分岐・核・透明グラデーションで個体差を表現'); 
      running=false;
    } catch(e){
      const dbg=$('debug-console'); dbg.style.display='block'; dbg.textContent='Boot error: '+ (e?.message||e);
      console.error('Boot error', e);
    }
  }
  boot();
  loop();
})();
</script>
